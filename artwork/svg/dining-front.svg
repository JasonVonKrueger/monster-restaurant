<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 800" width="540" height="800">
  <!-- Dining room front layer: the serving counter, drawn over Bubbles. Transparent above y=424. -->
  <g stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round">
    <!-- counter top, seen from a little above -->
    <rect x="-10" y="424" width="560" height="98" fill="#eee0fb"/>
    <!-- tiled front -->
    <rect x="-10" y="522" width="560" height="78" fill="#d7c0f1"/>
    <!-- trim band -->
    <rect x="-10" y="598" width="560" height="26" fill="#7068c9"/>
    <!-- base -->
    <rect x="-10" y="622" width="560" height="190" fill="#4f4b8e"/>
  </g>
  <rect x="-10" y="430" width="560" height="10" fill="#ffffff" opacity="0.45"/>
  <g stroke="#c3a6e6" stroke-width="5" stroke-linecap="round">
    <path d="M60 530 V592 M150 530 V592 M240 530 V592 M330 530 V592 M420 530 V592 M510 530 V592"/>
  </g>
  <!-- placemat under the dish (the dish is drawn on top by the game) -->
  <g stroke="#2b1d3a" stroke-width="3">
    <ellipse cx="270" cy="490" rx="112" ry="32" fill="#ffb7d9"/>
    <ellipse cx="270" cy="490" rx="96" ry="25" fill="#ffd3e8" stroke="#ff8fc8" stroke-dasharray="6 6"/>
  </g>
  <!-- the menu card is a separate, draggable sprite: see menu-sheet.svg -->
  <!-- flower vase -->
  <g stroke="#2b1d3a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M460 470 C456 446 452 426 444 410 M466 470 C468 444 474 424 486 408 M463 470 V400" fill="none" stroke="#3f9a5c" stroke-width="4"/>
    <circle cx="444" cy="404" r="11" fill="#ffd77f"/>
    <circle cx="463" cy="392" r="12" fill="#ff8fc8"/>
    <circle cx="487" cy="402" r="10" fill="#8fd8c8"/>
    <circle cx="463" cy="392" r="4" fill="#fff7dc" stroke="none"/>
    <path d="M446 468 H480 C484 486 482 500 474 506 H452 C444 500 442 486 446 468 Z" fill="#8fd3ee"/>
    <path d="M452 476 C451 486 452 494 456 500" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="4"/>
  </g>

  <!-- rounded pipe pattern on the base -->
  <g fill="none" stroke="#5f5aa6" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-10 690 H80 C110 690 110 730 140 730 H230"/>
    <path d="M300 660 V700 C300 720 320 730 340 730 H560"/>
    <path d="M40 800 V780 C40 760 60 750 80 750 H180 C200 750 210 770 210 800"/>
    <path d="M380 800 C380 776 400 770 420 770 H560"/>
  </g>
</svg>
