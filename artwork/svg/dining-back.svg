<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 800" width="540" height="800">
  <!-- Dining room back layer: lavender wall, a big window onto a candy-coloured evening,
       and two neon tubes. Bubbles, the counter (dining-front.svg) and controls go on top. -->
  <defs>
    <linearGradient id="wall" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#dcc6f4"/><stop offset="1" stop-color="#c9aeea"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffc2ef"/><stop offset="0.45" stop-color="#ffd0e4"/>
      <stop offset="0.75" stop-color="#ffdfc6"/><stop offset="1" stop-color="#ffcb9b"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="40%" r="62%">
      <stop offset="0" stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#3b2a6a" stop-opacity="0.25"/>
    </radialGradient>
    <clipPath id="glass"><rect x="82" y="194" width="376" height="232" rx="46"/></clipPath>
    <path id="sparkle" d="M0 -9 C1.5 -2 2 -1.5 9 0 C2 1.5 1.5 2 0 9 C-1.5 2 -2 1.5 -9 0 C-2 -1.5 -1.5 -2 0 -9 Z" fill="#ffffff"/>
  </defs>

  <rect width="540" height="800" fill="url(#wall)"/>

  <!-- wall panels, rivets and a few soft splotches -->
  <g stroke="#b99ddd" stroke-width="6" stroke-linecap="round">
    <path d="M56 130 V430 M484 130 V430"/>
  </g>
  <g fill="#b99ddd">
    <circle cx="56" cy="150" r="6"/><circle cx="484" cy="150" r="6"/>
    <ellipse cx="500" cy="470" rx="22" ry="12"/><ellipse cx="30" cy="160" rx="10" ry="16"/>
  </g>

  <!-- neon tubes -->
  <g>
    <rect x="10" y="206" width="38" height="200" rx="19" fill="#ff9fe3" opacity="0.35"/>
    <rect x="492" y="206" width="38" height="200" rx="19" fill="#ff9fe3" opacity="0.35"/>
    <rect x="21" y="214" width="16" height="184" rx="8" fill="#fff0fb" stroke="#ff7fd6" stroke-width="3"/>
    <rect x="503" y="214" width="16" height="184" rx="8" fill="#fff0fb" stroke="#ff7fd6" stroke-width="3"/>
    <g fill="#b598dc" stroke="#2b1d3a" stroke-width="3">
      <rect x="15" y="198" width="28" height="16" rx="6"/><rect x="15" y="398" width="28" height="16" rx="6"/>
      <rect x="497" y="198" width="28" height="16" rx="6"/><rect x="497" y="398" width="28" height="16" rx="6"/>
    </g>
  </g>

  <!-- window frame -->
  <rect x="64" y="176" width="412" height="268" rx="62" fill="#bfa2e3" stroke="#2b1d3a" stroke-width="4"/>
  <rect x="82" y="194" width="376" height="232" rx="46" fill="url(#sky)"/>

  <!-- the view -->
  <g clip-path="url(#glass)">
    <use href="#sparkle" x="132" y="232"/>
    <use href="#sparkle" x="402" y="226" transform="translate(402 226) scale(1.3) translate(-402 -226)"/>
    <use href="#sparkle" x="320" y="262" opacity="0.8"/>
    <use href="#sparkle" x="236" y="214" opacity="0.7"/>
    <!-- ringed planet -->
    <g stroke="#2b1d3a" stroke-width="3">
      <circle cx="176" cy="262" r="24" fill="#ff9fd0"/>
      <path d="M150 268 C140 274 142 280 158 278 C176 276 198 268 206 258 C212 250 206 248 200 250" fill="none" stroke="#ffe3f2" stroke-width="5" stroke-linecap="round"/>
    </g>
    <circle cx="168" cy="254" r="7" fill="#ffc6e5"/>
    <!-- clouds -->
    <g fill="#ffffff" opacity="0.85">
      <ellipse cx="350" cy="300" rx="34" ry="12"/><ellipse cx="372" cy="292" rx="18" ry="12"/>
      <ellipse cx="250" cy="320" rx="22" ry="8"/>
    </g>
    <!-- candy hills -->
    <path d="M70 372 C130 340 190 344 240 366 C300 392 360 340 470 352 V440 H70 Z" fill="#ffb7b0" stroke="#2b1d3a" stroke-width="3"/>
    <path d="M70 400 C150 378 220 384 280 402 C340 420 400 386 470 392 V440 H70 Z" fill="#f79b7e" stroke="#2b1d3a" stroke-width="3"/>
    <!-- lollipop trees -->
    <g stroke="#2b1d3a" stroke-width="3">
      <path d="M118 356 V384" stroke-width="4"/><circle cx="118" cy="348" r="14" fill="#8fd8c8"/>
      <path d="M418 344 V370" stroke-width="4"/><circle cx="418" cy="336" r="12" fill="#ffd77f"/>
      <path d="M300 386 V404" stroke-width="4"/><circle cx="300" cy="380" r="10" fill="#b9e6ff"/>
    </g>
    <!-- glass shine -->
    <path d="M340 194 L280 426 M392 194 L332 426" stroke="#ffffff" stroke-opacity="0.22" stroke-width="22"/>
  </g>
  <rect x="82" y="194" width="376" height="232" rx="46" fill="none" stroke="#2b1d3a" stroke-width="3"/>

  <rect width="540" height="800" fill="url(#spot)"/>
</svg>
