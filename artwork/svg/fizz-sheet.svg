<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2800 400" width="2800" height="400">
  <!-- Fizz: a wide orange three-eyed monster with a flame-shaped tuft.
       7 frames of 400x400: 0 idle, 1 blink, 2 wave, 3 chomp, 4 happy, 5 sad, 6 sad blink. -->
  <defs>
    <g id="back">
      <ellipse cx="146" cy="356" rx="40" ry="17" fill="#e0782b"/>
      <ellipse cx="254" cy="356" rx="40" ry="17" fill="#e0782b"/>
      <path d="M170 132 C158 98 186 84 180 54 C208 70 224 92 216 120 C228 106 238 104 242 94 C250 116 240 132 230 138 Z" fill="#ffd84d"/>
      <path d="M60 250 C60 170 120 120 200 120 C280 120 340 170 340 250 C340 322 280 362 200 362 C120 362 60 322 60 250 Z" fill="#ff9a4d"/>
      <path d="M86 290 C100 326 136 348 180 352" fill="none" stroke="#e0782b" stroke-width="12" opacity="0.55"/>
      <g fill="#f07f2e" stroke="none">
        <circle cx="96" cy="210" r="6"/><circle cx="306" cy="200" r="7"/>
        <circle cx="296" cy="314" r="5"/><circle cx="250" cy="146" r="4"/>
      </g>
      <ellipse cx="100" cy="270" rx="17" ry="10" fill="#ff8fb0" stroke="none"/>
      <ellipse cx="300" cy="270" rx="17" ry="10" fill="#ff8fb0" stroke="none"/>
    </g>
    <g id="eyes-open">
      <circle cx="138" cy="214" r="26" fill="#ffffff"/>
      <circle cx="200" cy="188" r="32" fill="#ffffff"/>
      <circle cx="262" cy="214" r="26" fill="#ffffff"/>
      <circle cx="141" cy="221" r="11" fill="#2b1d3a" stroke="none"/>
      <circle cx="203" cy="197" r="14" fill="#2b1d3a" stroke="none"/>
      <circle cx="259" cy="221" r="11" fill="#2b1d3a" stroke="none"/>
      <circle cx="145" cy="216" r="4" fill="#ffffff" stroke="none"/>
      <circle cx="208" cy="191" r="5" fill="#ffffff" stroke="none"/>
      <circle cx="263" cy="216" r="4" fill="#ffffff" stroke="none"/>
    </g>
    <g id="eyes-closed" fill="none" stroke-width="6">
      <path d="M114 218 Q138 232 162 218"/><path d="M170 192 Q200 210 230 192"/><path d="M238 218 Q262 232 286 218"/>
    </g>
    <g id="eyes-happy" fill="none" stroke-width="6">
      <path d="M116 224 Q138 198 160 224"/><path d="M172 200 Q200 170 228 200"/><path d="M240 224 Q262 198 284 224"/>
    </g>
    <g id="mouth-smile">
      <path d="M168 266 Q200 310 232 266 Q200 278 168 266 Z" fill="#6b1f4f"/>
      <path d="M184 286 Q200 276 216 286 Q200 300 184 286 Z" fill="#ff7aa8" stroke="none"/>
    </g>
    <g id="mouth-chomp">
      <ellipse cx="200" cy="290" rx="36" ry="32" fill="#6b1f4f"/>
      <ellipse cx="200" cy="308" rx="20" ry="10" fill="#ff7aa8" stroke="none"/>
    </g>
    <g id="mouth-grin">
      <path d="M154 262 Q200 334 246 262 Q200 276 154 262 Z" fill="#6b1f4f"/>
      <path d="M176 298 Q200 282 224 298 Q200 318 176 298 Z" fill="#ff7aa8" stroke="none"/>
    </g>
    <g id="arm-left-down">
      <path d="M74 262 C52 274 44 292 48 310" fill="none" stroke-width="24"/>
      <path d="M74 262 C52 274 44 292 48 310" fill="none" stroke="#ff9a4d" stroke-width="16"/>
      <circle cx="48" cy="314" r="15" fill="#ff9a4d"/>
    </g>
    <g id="arm-right-down">
      <path d="M326 262 C348 274 356 292 352 310" fill="none" stroke-width="24"/>
      <path d="M326 262 C348 274 356 292 352 310" fill="none" stroke="#ff9a4d" stroke-width="16"/>
      <circle cx="352" cy="314" r="15" fill="#ff9a4d"/>
    </g>
    <g id="arm-left-up">
      <path d="M74 252 C48 232 40 206 46 180" fill="none" stroke-width="24"/>
      <path d="M74 252 C48 232 40 206 46 180" fill="none" stroke="#ff9a4d" stroke-width="16"/>
      <circle cx="46" cy="174" r="15" fill="#ff9a4d"/>
    </g>
    <g id="arm-right-up">
      <path d="M326 252 C352 232 360 206 354 180" fill="none" stroke-width="24"/>
      <path d="M326 252 C352 232 360 206 354 180" fill="none" stroke="#ff9a4d" stroke-width="16"/>
      <circle cx="354" cy="174" r="15" fill="#ff9a4d"/>
    </g>
    <g id="eyes-sad">
      <circle cx="138" cy="214" r="26" fill="#ffffff"/>
      <circle cx="200" cy="188" r="32" fill="#ffffff"/>
      <circle cx="262" cy="214" r="26" fill="#ffffff"/>
      <circle cx="139" cy="228" r="10" fill="#2b1d3a" stroke="none"/>
      <circle cx="201" cy="206" r="13" fill="#2b1d3a" stroke="none"/>
      <circle cx="261" cy="228" r="10" fill="#2b1d3a" stroke="none"/>
    </g>
    <g id="brows-sad"><path d="M112 184 L160 174 M170 150 L200 140 L230 150 M240 174 L288 184" fill="none" stroke-width="5"/></g>
    <g id="mouth-frown"><path d="M176 296 Q200 272 224 296" fill="none" stroke-width="6"/></g>
  </defs>
  <g stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <g><use href="#back"/><use href="#eyes-open"/><use href="#mouth-smile"/><use href="#arm-left-down"/><use href="#arm-right-down"/></g>
    <g transform="translate(400 0)"><use href="#back"/><use href="#eyes-closed"/><use href="#mouth-smile"/><use href="#arm-left-down"/><use href="#arm-right-down"/></g>
    <g transform="translate(800 0)"><use href="#back"/><use href="#eyes-open"/><use href="#mouth-smile"/><use href="#arm-left-down"/><use href="#arm-right-up"/></g>
    <g transform="translate(1200 0)"><use href="#back"/><use href="#eyes-happy"/><use href="#mouth-chomp"/><use href="#arm-left-down"/><use href="#arm-right-down"/></g>
    <g transform="translate(1600 0)"><use href="#back"/><use href="#eyes-happy"/><use href="#mouth-grin"/><use href="#arm-left-up"/><use href="#arm-right-up"/></g>
    <g transform="translate(2000 0)"><use href="#back"/><use href="#eyes-sad"/><use href="#brows-sad"/><use href="#mouth-frown"/><use href="#arm-left-down"/><use href="#arm-right-down"/></g>
    <g transform="translate(2400 0)"><use href="#back"/><use href="#eyes-closed"/><use href="#brows-sad"/><use href="#mouth-frown"/><use href="#arm-left-down"/><use href="#arm-right-down"/></g>
  </g>
</svg>
