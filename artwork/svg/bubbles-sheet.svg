<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 400" width="2400" height="400">
  <!-- Bubbles sprite sheet: 6 frames of 400x400, transparent background.
       Frame order: 0 idle, 1 blink, 2 wave, 3 chomp, 4 happy, 5 sad. Parts live in <defs>. -->
  <defs>
    <g id="back">
      <!-- feet -->
      <ellipse cx="150" cy="354" rx="40" ry="18" fill="#8447d6"/>
      <ellipse cx="250" cy="354" rx="40" ry="18" fill="#8447d6"/>
      <!-- horns and a fur tuft, tucked behind the body -->
      <path d="M130 116 C118 92 116 72 124 58 C138 70 150 90 156 108 Z" fill="#ffd84d"/>
      <path d="M270 116 C282 92 284 72 276 58 C262 70 250 90 244 108 Z" fill="#ffd84d"/>
      <path d="M166 96 L178 60 L192 88 L204 52 L218 88 L232 62 L238 98 Z" fill="#a56cf0"/>
      <!-- body -->
      <path d="M70 230 C70 140 120 80 200 80 C280 80 330 140 330 230 C330 312 280 362 200 362 C120 362 70 312 70 230 Z" fill="#a56cf0"/>
      <path d="M98 272 C106 312 140 340 182 348" fill="none" stroke="#8447d6" stroke-width="12" opacity="0.6"/>
      <g fill="#8a4ee0" stroke="none">
        <circle cx="108" cy="196" r="6"/><circle cx="300" cy="182" r="5"/>
        <circle cx="292" cy="306" r="7"/><circle cx="124" cy="306" r="4"/><circle cx="214" cy="118" r="5"/>
      </g>
      <ellipse cx="120" cy="262" rx="18" ry="11" fill="#ff8fc8" stroke="none"/>
      <ellipse cx="280" cy="262" rx="18" ry="11" fill="#ff8fc8" stroke="none"/>
    </g>

    <g id="eyes-open">
      <ellipse cx="158" cy="198" rx="40" ry="46" fill="#ffffff"/>
      <ellipse cx="242" cy="198" rx="40" ry="46" fill="#ffffff"/>
      <circle cx="164" cy="208" r="19" fill="#2b1d3a" stroke="none"/>
      <circle cx="236" cy="208" r="19" fill="#2b1d3a" stroke="none"/>
      <circle cx="170" cy="200" r="6" fill="#ffffff" stroke="none"/>
      <circle cx="242" cy="200" r="6" fill="#ffffff" stroke="none"/>
    </g>
    <g id="eyes-closed" fill="none" stroke-width="6">
      <path d="M122 204 Q158 224 194 204"/>
      <path d="M206 204 Q242 224 278 204"/>
    </g>
    <g id="eyes-happy" fill="none" stroke-width="6">
      <path d="M124 214 Q158 176 192 214"/>
      <path d="M208 214 Q242 176 276 214"/>
    </g>

    <g id="mouth-smile">
      <path d="M168 262 Q200 306 232 262 Q200 274 168 262 Z" fill="#6b1f4f"/>
      <path d="M184 282 Q200 272 216 282 Q200 296 184 282 Z" fill="#ff7aa8" stroke="none"/>
    </g>
    <g id="mouth-chomp">
      <ellipse cx="200" cy="284" rx="36" ry="32" fill="#6b1f4f"/>
      <ellipse cx="200" cy="302" rx="20" ry="10" fill="#ff7aa8" stroke="none"/>
      <path d="M188 254 L194 266 L200 254 Z" fill="#ffffff" stroke-width="2.5"/>
    </g>
    <g id="mouth-grin">
      <path d="M154 258 Q200 330 246 258 Q200 272 154 258 Z" fill="#6b1f4f"/>
      <path d="M176 294 Q200 278 224 294 Q200 314 176 294 Z" fill="#ff7aa8" stroke="none"/>
    </g>

    <!-- arms: an ink stroke under a body-coloured stroke, so they read as outlined tubes -->
    <g id="arm-left-down">
      <path d="M86 252 C62 264 52 284 56 304" fill="none" stroke-width="24"/>
      <path d="M86 252 C62 264 52 284 56 304" fill="none" stroke="#a56cf0" stroke-width="16"/>
      <circle cx="56" cy="308" r="15" fill="#a56cf0"/>
    </g>
    <g id="arm-right-down">
      <path d="M314 252 C338 264 348 284 344 304" fill="none" stroke-width="24"/>
      <path d="M314 252 C338 264 348 284 344 304" fill="none" stroke="#a56cf0" stroke-width="16"/>
      <circle cx="344" cy="308" r="15" fill="#a56cf0"/>
    </g>
    <g id="arm-left-up">
      <path d="M86 240 C58 222 48 196 52 168" fill="none" stroke-width="24"/>
      <path d="M86 240 C58 222 48 196 52 168" fill="none" stroke="#a56cf0" stroke-width="16"/>
      <circle cx="52" cy="162" r="15" fill="#a56cf0"/>
    </g>
    <g id="arm-right-up">
      <path d="M314 240 C342 222 352 196 348 168" fill="none" stroke-width="24"/>
      <path d="M314 240 C342 222 352 196 348 168" fill="none" stroke="#a56cf0" stroke-width="16"/>
      <circle cx="348" cy="162" r="15" fill="#a56cf0"/>
    </g>
    <g id="eyes-sad">
      <ellipse cx="158" cy="198" rx="40" ry="46" fill="#ffffff"/>
      <ellipse cx="242" cy="198" rx="40" ry="46" fill="#ffffff"/>
      <circle cx="162" cy="220" r="17" fill="#2b1d3a" stroke="none"/>
      <circle cx="238" cy="220" r="17" fill="#2b1d3a" stroke="none"/>
      <path d="M124 146 L182 132 M218 132 L276 146" fill="none" stroke-width="6"/>
      <path d="M122 236 C116 246 116 254 122 256 C128 254 128 246 122 236 Z" fill="#8fd3ff" stroke-width="2.5"/>
    </g>
    <g id="mouth-frown"><path d="M176 290 Q200 266 224 290" fill="none" stroke-width="6"/></g>
  </defs>

  <g stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <g>
      <use href="#back"/><use href="#eyes-open"/><use href="#mouth-smile"/>
      <use href="#arm-left-down"/><use href="#arm-right-down"/>
    </g>
    <g transform="translate(400 0)">
      <use href="#back"/><use href="#eyes-closed"/><use href="#mouth-smile"/>
      <use href="#arm-left-down"/><use href="#arm-right-down"/>
    </g>
    <g transform="translate(800 0)">
      <use href="#back"/><use href="#eyes-open"/><use href="#mouth-smile"/>
      <use href="#arm-left-down"/><use href="#arm-right-up"/>
    </g>
    <g transform="translate(1200 0)">
      <use href="#back"/><use href="#eyes-happy"/><use href="#mouth-chomp"/>
      <use href="#arm-left-down"/><use href="#arm-right-down"/>
    </g>
    <g transform="translate(1600 0)">
      <use href="#back"/><use href="#eyes-happy"/><use href="#mouth-grin"/>
      <use href="#arm-left-up"/><use href="#arm-right-up"/>
    </g>
    <g transform="translate(2000 0)"><use href="#back"/><use href="#eyes-sad"/><use href="#mouth-frown"/><use href="#arm-left-down"/><use href="#arm-right-down"/></g>
  </g>
</svg>
