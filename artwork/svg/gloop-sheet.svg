<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 400" width="2400" height="400">
  <!-- Gloop: a teal slime drop with eyes on stalks.
       6 frames of 400x400: 0 idle, 1 blink, 2 wave, 3 chomp, 4 happy, 5 sad. -->
  <defs>
    <g id="back">
      <!-- eye stalks: ink tube under a slime tube -->
      <path d="M172 150 C164 126 156 110 150 94 M228 150 C236 126 244 110 250 94" fill="none" stroke-width="22"/>
      <path d="M172 150 C164 126 156 110 150 94 M228 150 C236 126 244 110 250 94" fill="none" stroke="#4fd1c5" stroke-width="14"/>
      <ellipse cx="200" cy="356" rx="146" ry="18" fill="#3bb3a8"/>
      <path d="M200 110 C236 150 330 196 330 272 C330 330 280 360 200 360 C120 360 70 330 70 272 C70 196 164 150 200 110 Z" fill="#4fd1c5"/>
      <path d="M126 210 C110 234 104 256 108 280" fill="none" stroke="#ffffff" stroke-width="10" opacity="0.55"/>
      <circle cx="130" cy="196" r="5" fill="#ffffff" opacity="0.7" stroke="none"/>
      <g fill="#3bb3a8" stroke="none">
        <circle cx="290" cy="250" r="7"/><circle cx="262" cy="318" r="5"/><circle cx="214" cy="160" r="4"/>
      </g>
      <ellipse cx="124" cy="262" rx="16" ry="10" fill="#ff8fb0" stroke="none"/>
      <ellipse cx="276" cy="262" rx="16" ry="10" fill="#ff8fb0" stroke="none"/>
    </g>
    <g id="eyes-open">
      <circle cx="148" cy="84" r="30" fill="#ffffff"/>
      <circle cx="252" cy="84" r="30" fill="#ffffff"/>
      <circle cx="152" cy="92" r="13" fill="#2b1d3a" stroke="none"/>
      <circle cx="248" cy="92" r="13" fill="#2b1d3a" stroke="none"/>
      <circle cx="157" cy="86" r="5" fill="#ffffff" stroke="none"/>
      <circle cx="253" cy="86" r="5" fill="#ffffff" stroke="none"/>
    </g>
    <g id="eyes-closed">
      <circle cx="148" cy="84" r="30" fill="#4fd1c5"/>
      <circle cx="252" cy="84" r="30" fill="#4fd1c5"/>
      <path d="M124 88 Q148 104 172 88 M228 88 Q252 104 276 88" fill="none" stroke-width="6"/>
    </g>
    <g id="eyes-happy">
      <circle cx="148" cy="84" r="30" fill="#4fd1c5"/>
      <circle cx="252" cy="84" r="30" fill="#4fd1c5"/>
      <path d="M126 96 Q148 66 170 96 M230 96 Q252 66 274 96" fill="none" stroke-width="6"/>
    </g>
    <g id="mouth-smile">
      <path d="M168 248 Q200 292 232 248 Q200 260 168 248 Z" fill="#1f5f6b"/>
      <path d="M184 268 Q200 258 216 268 Q200 282 184 268 Z" fill="#ff7aa8" stroke="none"/>
    </g>
    <g id="mouth-chomp">
      <ellipse cx="200" cy="272" rx="36" ry="32" fill="#1f5f6b"/>
      <ellipse cx="200" cy="290" rx="20" ry="10" fill="#ff7aa8" stroke="none"/>
    </g>
    <g id="mouth-grin">
      <path d="M154 244 Q200 316 246 244 Q200 258 154 244 Z" fill="#1f5f6b"/>
      <path d="M176 280 Q200 264 224 280 Q200 300 176 280 Z" fill="#ff7aa8" stroke="none"/>
    </g>
    <g id="arm-left-down">
      <path d="M86 260 C62 272 52 292 56 312" fill="none" stroke-width="24"/>
      <path d="M86 260 C62 272 52 292 56 312" fill="none" stroke="#4fd1c5" stroke-width="16"/>
      <circle cx="56" cy="316" r="15" fill="#4fd1c5"/>
    </g>
    <g id="arm-right-down">
      <path d="M314 260 C338 272 348 292 344 312" fill="none" stroke-width="24"/>
      <path d="M314 260 C338 272 348 292 344 312" fill="none" stroke="#4fd1c5" stroke-width="16"/>
      <circle cx="344" cy="316" r="15" fill="#4fd1c5"/>
    </g>
    <g id="arm-left-up">
      <path d="M90 246 C62 228 52 202 56 174" fill="none" stroke-width="24"/>
      <path d="M90 246 C62 228 52 202 56 174" fill="none" stroke="#4fd1c5" stroke-width="16"/>
      <circle cx="56" cy="168" r="15" fill="#4fd1c5"/>
    </g>
    <g id="arm-right-up">
      <path d="M310 246 C338 228 348 202 344 174" fill="none" stroke-width="24"/>
      <path d="M310 246 C338 228 348 202 344 174" fill="none" stroke="#4fd1c5" stroke-width="16"/>
      <circle cx="344" cy="168" r="15" fill="#4fd1c5"/>
    </g>
    <g id="eyes-sad">
      <circle cx="148" cy="84" r="30" fill="#ffffff"/>
      <circle cx="252" cy="84" r="30" fill="#ffffff"/>
      <circle cx="149" cy="100" r="12" fill="#2b1d3a" stroke="none"/>
      <circle cx="251" cy="100" r="12" fill="#2b1d3a" stroke="none"/>
      <path d="M118 48 L170 36 M230 36 L282 48" fill="none" stroke-width="6"/>
      <path d="M116 112 C110 122 110 130 116 132 C122 130 122 122 116 112 Z" fill="#8fd3ff" stroke-width="2.5"/>
    </g>
    <g id="mouth-frown"><path d="M176 276 Q200 252 224 276" fill="none" stroke-width="6"/></g>
  </defs>
  <g stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <g><use href="#back"/><use href="#eyes-open"/><use href="#mouth-smile"/><use href="#arm-left-down"/><use href="#arm-right-down"/></g>
    <g transform="translate(400 0)"><use href="#back"/><use href="#eyes-closed"/><use href="#mouth-smile"/><use href="#arm-left-down"/><use href="#arm-right-down"/></g>
    <g transform="translate(800 0)"><use href="#back"/><use href="#eyes-open"/><use href="#mouth-smile"/><use href="#arm-left-down"/><use href="#arm-right-up"/></g>
    <g transform="translate(1200 0)"><use href="#back"/><use href="#eyes-happy"/><use href="#mouth-chomp"/><use href="#arm-left-down"/><use href="#arm-right-down"/></g>
    <g transform="translate(1600 0)"><use href="#back"/><use href="#eyes-happy"/><use href="#mouth-grin"/><use href="#arm-left-up"/><use href="#arm-right-up"/></g>
    <g transform="translate(2000 0)"><use href="#back"/><use href="#eyes-sad"/><use href="#mouth-frown"/><use href="#arm-left-down"/><use href="#arm-right-down"/></g>
  </g>
</svg>
