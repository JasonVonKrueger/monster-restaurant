<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 800" width="540" height="800">
  <!-- Kitchen back layer: wall and stove. Pip, the counter (kitchen-front.svg) and the
       live ticket, oven timer and controls are drawn over this by KitchenScene. -->
  <defs>
    <pattern id="tiles" width="54" height="54" patternUnits="userSpaceOnUse">
      <rect width="54" height="54" fill="#8fd3ee"/>
      <rect x="3" y="3" width="48" height="48" rx="5" fill="#a6def3"/>
      <path d="M9 12 Q12 8 18 8" stroke="#d4f1fb" stroke-width="3" fill="none" stroke-linecap="round"/>
    </pattern>
    <radialGradient id="spot" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#1b2a4a" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <rect width="540" height="800" fill="url(#tiles)"/>

  <!-- stove: the counter covers it from y=430 down -->
  <g stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round">
    <rect x="40" y="300" width="460" height="230" rx="18" fill="#f4b63f"/>
    <rect x="40" y="300" width="460" height="34" rx="14" fill="#ffd36b"/>
    <rect x="64" y="368" width="132" height="110" rx="14" fill="#e59a26"/>
    <rect x="344" y="368" width="132" height="110" rx="14" fill="#e59a26"/>
    <rect x="80" y="386" width="100" height="56" rx="10" fill="#4b3d5e" stroke-width="3"/>
    <rect x="360" y="386" width="100" height="56" rx="10" fill="#4b3d5e" stroke-width="3"/>
    <g fill="#f7f4fb" stroke-width="3">
      <circle cx="96" cy="350" r="7"/><circle cx="130" cy="350" r="7"/><circle cx="164" cy="350" r="7"/>
      <circle cx="376" cy="350" r="7"/><circle cx="410" cy="350" r="7"/><circle cx="444" cy="350" r="7"/>
    </g>
  </g>
  <rect x="62" y="306" width="150" height="20" rx="6" fill="#4b3d5e"/>
  <rect x="328" y="306" width="150" height="20" rx="6" fill="#4b3d5e"/>
  <path d="M72 316 H202 M338 316 H468" stroke="#7d6d94" stroke-width="3" stroke-dasharray="10 6"/>
  <path d="M90 402 Q100 394 112 398 M370 402 Q380 394 392 398" stroke="#8a78a8" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- a little steam from the burners -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="5" stroke-linecap="round">
    <path d="M110 290 C100 276 120 266 110 250"/>
    <path d="M430 290 C420 276 440 266 430 250"/>
  </g>

  <rect width="540" height="800" fill="url(#spot)"/>
</svg>
