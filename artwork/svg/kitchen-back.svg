<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 800" width="540" height="800">
  <!-- Kitchen back layer: wall and stove. Pip, the counter (kitchen-front.svg) and the
       live ticket, oven timer and controls are drawn over this by KitchenScene. -->
  <defs>
    <pattern id="tiles" width="54" height="54" patternUnits="userSpaceOnUse">
      <rect width="54" height="54" fill="#8fd3ee"/>
      <rect x="3" y="3" width="48" height="48" rx="5" fill="#a6def3"/>
      <path d="M9 12 Q12 8 18 8" stroke="#d4f1fb" stroke-width="3" fill="none" stroke-linecap="round"/>
    </pattern>
    <radialGradient id="spot" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#1b2a4a" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <rect width="540" height="800" fill="url(#tiles)"/>

  <!-- stove: the counter covers it from y=430 down. The oven door is big, with a wide
       window (x 62–194, y 348–418), so there is lots of room to drop the pizza in;
       KitchenScene's OVEN point is the window's centre. -->
  <g stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round">
    <rect x="34" y="276" width="472" height="254" rx="18" fill="#f4b63f"/>
    <rect x="34" y="276" width="472" height="34" rx="14" fill="#ffd36b"/>
    <rect x="48" y="320" width="160" height="200" rx="16" fill="#e59a26"/>
    <rect x="62" y="348" width="132" height="70" rx="12" fill="#4b3d5e" stroke-width="3"/>
    <g fill="#f7f4fb" stroke-width="3">
      <circle cx="96" cy="334" r="6"/><circle cx="128" cy="334" r="6"/><circle cx="160" cy="334" r="6"/>
    </g>
  </g>
  <rect x="58" y="282" width="150" height="20" rx="6" fill="#4b3d5e"/>
  <rect x="332" y="282" width="150" height="20" rx="6" fill="#4b3d5e"/>
  <path d="M68 292 H198 M342 292 H472" stroke="#7d6d94" stroke-width="3" stroke-dasharray="10 6"/>
  <path d="M76 366 Q90 356 106 360" stroke="#8a78a8" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- a little steam from the burners -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="5" stroke-linecap="round">
    <path d="M110 266 C100 252 120 242 110 226"/>
    <path d="M430 266 C420 252 440 242 430 226"/>
  </g>

  <rect width="540" height="800" fill="url(#spot)"/>
</svg>
