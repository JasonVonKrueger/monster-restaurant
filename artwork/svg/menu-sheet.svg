<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" width="400" height="150">
  <!-- The dining room menu: 2 frames of 200x150, transparent background.
       Frame 0: closed, standing on the counter. Frame 1: open and held up, seen from the outside (we face the reader). -->
  <defs>
    <path id="heart" d="M0 6 C-7 1 -8 -3 -5 -5.5 C-2.5 -7 0 -5 0 -3 C0 -5 2.5 -7 5 -5.5 C8 -3 7 1 0 6 Z" fill="#ff3d6e" stroke="#2b1d3a" stroke-width="1.6"/>
    <g id="pizza">
      <circle r="24" fill="#f3c47c" stroke="#2b1d3a" stroke-width="3"/>
      <circle r="18" fill="#e5533d"/>
      <circle cx="-6" cy="-5" r="5" fill="#ffd75e"/><circle cx="7" cy="4" r="5" fill="#ffd75e"/>
      <use href="#heart" x="6" y="-7"/><use href="#heart" x="-7" y="7"/>
    </g>
  </defs>

  <!-- frame 0: closed tent card -->
  <g stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M20 145 L44 9 H156 L180 145 Z" fill="#9b8bd8"/>
    <path d="M33 136 L53 20 H147 L167 136 Z" fill="#fff7dc" stroke-width="3"/>
    <path d="M70 102 H130 M76 118 H124" stroke="#c9bde0" stroke-width="6"/>
  </g>
  <use href="#pizza" transform="translate(100 60) scale(1.1)"/>

  <!-- frame 1: the open menu seen from across the counter. The monster reads the inside,
       so we see the outside: back cover on our left, front cover (with the pizza) on our
       right, the spine between them, and the page edges peeking out at the top. -->
  <g transform="translate(200 0)" stroke="#2b1d3a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M14 30 Q57 18 98 30 V140 Q57 130 14 140 Z" fill="#fff7dc" stroke-width="3"/>
    <path d="M102 30 Q143 18 186 30 V140 Q143 130 102 140 Z" fill="#fff7dc" stroke-width="3"/>
    <path d="M6 36 Q53 24 96 36 V146 Q53 136 6 146 Z" fill="#8a79cc"/>
    <path d="M104 36 Q147 24 194 36 V146 Q147 136 104 146 Z" fill="#9b8bd8"/>
    <rect x="92" y="32" width="16" height="116" rx="6" fill="#6f5fb3"/>
    <path d="M24 120 Q52 112 80 120" fill="none" stroke="#b6a9e6" stroke-width="5"/>
    <path d="M122 124 H176" stroke="#fff7dc" stroke-width="5"/>
  </g>
  <use href="#pizza" transform="translate(349 82) scale(1.05)"/>
</svg>
