  <!-- Kitchen front layer: the work counter, drawn over Pip. Transparent above y=424.
       A butcher-block top seen from above: plank seams run toward a vanishing point
       behind the wall, it is shaded where it meets the backsplash and brightens toward
       the front lip. Seams are generated with vanishing point (270, 40). -->
