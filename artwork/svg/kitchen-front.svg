    <linearGradient id="top" x1="0" y1="442" x2="0" y2="786" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b8703f"/>
      <stop offset="0.35" stop-color="#cf8a52"/>
      <stop offset="1" stop-color="#e3a466"/>
    </linearGradient>
    <linearGradient id="backShade" x1="0" y1="442" x2="0" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b1d3a" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#2b1d3a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sheen" cx="270" cy="640" r="260" gradientTransform="matrix(1 0 0 0.45 0 352)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff3dc" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff3dc" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="-10" y="436" width="560" height="360" fill="url(#top)"/>
